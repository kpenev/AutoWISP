# AutoWISP test grid: OS x Python x numpy{1,2}, mirroring AstroWISP's coverage.
# See numpy2_plan.md ("CI test grid") for the rationale and the decisions this
# encodes (L-shaped matrix, offline catalogs, full_pipeline on ubuntu np1/np2).
#
# AutoWISP is pure Python (no compiled extension), so a cell is just:
#   pip install .  ->  force the target numpy  ->  run a subset of the suite.
name: Tests

# Manual only, like AstroWISP -- the full grid is expensive, so dispatch it for
# release validation. (A lightweight auto PR-smoke track is a possible follow-up.)
#
# `only` narrows a dispatch to one group of jobs. Re-running a single job after
# a fix otherwise means paying for the whole grid: workflow_dispatch has no job
# filter, and cancelling a run cancels every job in it, including the one being
# watched.
#
# `quick` runs the pipeline grid without the tests that run pipeline steps on
# the test data, the full pipeline and the live catalog queries: everything
# else, on every OS, in minutes rather than an hour.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Which jobs to run
        required: false
        default: all
        type: choice
        options:
          - all
          - pipeline
          - quick
          - catalog
          - migrations

permissions:
  contents: read

jobs:
  # Pipeline + logic tests. Catalog queries are served from the cached fixtures
  # that AutoWISPTestCase.setUp stages into the processing dir; the
  # AUTOWISP_NO_LIVE_CATALOG guard turns any *uncovered* query into a loud,
  # offline failure instead of a flaky network call. TestCatalog (live Gaia) is
  # excluded here and runs in its own job.
  pipeline:
    if: inputs.only == 'all' || inputs.only == 'pipeline' || inputs.only == 'quick'
    name: ${{ matrix.os }} py${{ matrix.python-version }} np${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu: full python x numpy sweep; full_pipeline on the 3.12 cells
          - { os: ubuntu-latest,  python-version: '3.11', numpy: '1', full_pipeline: false }
          - { os: ubuntu-latest,  python-version: '3.11', numpy: '2', full_pipeline: false }
          - { os: ubuntu-latest,  python-version: '3.12', numpy: '1', full_pipeline: true  }
          - { os: ubuntu-latest,  python-version: '3.12', numpy: '2', full_pipeline: true  }
          # OS coverage: one representative cell per non-ubuntu OS + off-Linux numpy 1.
          # macos-15-intel runs numpy 1 with an older llvmlite (<0.44 -> 0.43, the last
          # with an x86_64 macOS wheel). The numpy-2.4-compatible numba pulls llvmlite
          # 0.48, which ships no Intel wheel and would need an LLVM source build; numpy 1
          # lets us pin back to numba 0.60 / llvmlite 0.43. Apple-silicon (macos-14) is
          # the primary macOS target.
          - { os: windows-2022,   python-version: '3.12', numpy: '2', full_pipeline: false }
          - { os: macos-14,       python-version: '3.12', numpy: '2', full_pipeline: false }
          - { os: macos-14,       python-version: '3.12', numpy: '1', full_pipeline: false }
          - { os: macos-15-intel, python-version: '3.12', numpy: '1', full_pipeline: false, extra_pip: '"llvmlite<0.44"' }
          # 3.13 / 3.14 (numpy 2 only; numpy 1.26 has no 3.13/3.14 wheels).
          - { os: ubuntu-latest,  python-version: '3.13', numpy: '2', full_pipeline: false }
          - { os: ubuntu-latest,  python-version: '3.14', numpy: '2', full_pipeline: false }
          # Centralised project database. AutoWISP runs against MariaDB in
          # production, but every other cell puts the project database in
          # SQLite -- which compares strings case-sensitively, enforces
          # neither foreign keys nor column widths, and serialises writers
          # instead of taking row locks. This cell is regression cover for
          # the centralised path.
          #
          # The server is started with `docker run` rather than as a job
          # `services:` container, because services are Linux-only and
          # job-level: declaring one here would break the Windows and macOS
          # cells. Same pinned image either way.
          - { os: ubuntu-latest,  python-version: '3.12', numpy: '2', full_pipeline: true, mariadb: true }
    env:
      AUTOWISP_NO_LIVE_CATALOG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # TestUpgradeFromRelease exports the schema from each release tag;
          # the default shallow clone has no tags and it would skip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AutoWISP + numpy ${{ matrix.numpy }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Resolve numpy together with autowisp's deps (not as a post-install
          # downgrade) so pip picks a numpy-1-compatible astropy etc. on the
          # numpy-1 cells rather than leaving numpy-2-only versions in place.
          # matrix.extra_pip adds per-cell constraints (Intel mac pins llvmlite).
          python -m pip install "numpy${{ matrix.numpy == '1' && '<2' || '>=2' }}" ${{ matrix.extra_pip }} .
          python -c "from importlib.metadata import version; print('numpy', version('numpy'), '| astrowisp', version('astrowisp'))"
      # --help parses arguments and exits, but only after start.py has
      # imported the settings, and through them the whole browser-interface
      # import chain. That chain is what no test reaches: the suite puts
      # browser_interface on sys.path itself, so an import inside it naming a
      # bare django_project resolves there and fails only for the installed
      # entry point, which is exactly how one shipped broken.
      - name: Smoke-test the BUI entry point
        shell: bash
        run: wisp-bui --help
      # Solve astrometry locally on Linux/macOS: just install solve-field. The
      # test harness points solve_astrometry at the astrometry.net indices bundled
      # in the test data (via AUTOWISP_ANET_INDICES). Windows has no practical
      # solve-field, so local_solver_available() makes it fall back to the web
      # solver -- and as the only Windows cell it is the one live web check.
      # Only the step tests solve, so `quick` skips it.
      - name: Install solve-field (local plate solving)
        if: runner.os != 'Windows' && inputs.only != 'quick'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq astrometry.net ;;
            macOS) brew install astrometry-net ;;
            *) echo "No solve-field install for $RUNNER_OS"; exit 1 ;;
          esac
      # ONLY_FULL_GROUP_BY is the one meaningful strictness MySQL enables by
      # default and MariaDB does not; turning it on keeps that check while
      # still testing the server actually deployed.
      - name: Start MariaDB
        if: matrix.mariadb
        shell: bash
        run: |
          docker run --detach --name mariadb --publish 3306:3306 \
              --env MARIADB_ROOT_PASSWORD=autowisp \
              --env MARIADB_DATABASE=autowisp_pipeline \
              mariadb:11 --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES
          until docker exec mariadb \
                  healthcheck.sh --connect --innodb_initialized; do
            sleep 2
          done
          python -m pip install pymysql
      - name: Run tests
        shell: bash
        env:
          # Empty on every other cell, which server_test_url() reads as
          # unset, leaving those runs on SQLite.
          AUTOWISP_TEST_DB_URL: ${{ matrix.mariadb && 'mysql+pymysql://root:autowisp@127.0.0.1:3306/autowisp_pipeline' || '' }}
        run: |
          # Exclude the live-Gaia catalog tests everywhere; also exclude the
          # expensive full-pipeline integration test unless this cell opts in.
          EXCLUDE="TestCatalog"
          if [ "${{ matrix.full_pipeline }}" != "true" ] \
                  || [ "${{ inputs.only }}" = "quick" ]; then
            EXCLUDE="$EXCLUDE TestFullPipeline"
          fi
          # The tests running pipeline steps on the test data take most of an
          # hour; everything else takes about ten minutes.
          if [ "${{ inputs.only }}" = "quick" ]; then
            EXCLUDE="$EXCLUDE TestCalibrate TestStackToMaster TestFindStars"
            EXCLUDE="$EXCLUDE TestSolveAstrometry TestFitStarShape"
            EXCLUDE="$EXCLUDE TestMeasureAperturePhotometry"
            EXCLUDE="$EXCLUDE TestFitSourceExtractedPSFMap TestFitMagnitudes"
            EXCLUDE="$EXCLUDE TestCreateLightcurves TestEPD TestTFA"
            EXCLUDE="$EXCLUDE TestDetrendingStat TestLCFilter"
          fi
          python -m autowisp.tests failed_test --test-log test-output.txt -v --exclude $EXCLUDE
      # The results go to test-output.txt, which is kept only when a job
      # fails, so a green job would otherwise show nothing of what it
      # skipped.
      - name: Summarise skipped tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f test-output.txt ]; then
            grep -B1 -E '\.\.\. skipped' test-output.txt || true
            grep -E '^Ran [0-9]+ tests|^(OK|FAILED)' test-output.txt || true
          fi
      - name: Upload failed-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ matrix.os }}-py${{ matrix.python-version }}-np${{ matrix.numpy }}
          path: |
            failed_test
            test-output.txt
          if-no-files-found: ignore
          retention-days: 3

  # CATALOG / ADQL tests -- LIVE Gaia, ubuntu only, no cache guard.
  # OS-independent, so one OS across the numpy/python sweep.
  catalog:
    if: inputs.only == 'all' || inputs.only == 'catalog'
    name: catalog py${{ matrix.python-version }} np${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        numpy: ['1', '2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AutoWISP + numpy ${{ matrix.numpy }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy${{ matrix.numpy == '1' && '<2' || '>=2' }}" .
      - name: Run catalog tests (live Gaia)
        run: python -m autowisp.tests failed_test --test-log test-output.txt -v -k TestCatalog
      - name: Upload failed-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-catalog-py${{ matrix.python-version }}-np${{ matrix.numpy }}
          path: |
            failed_test
            test-output.txt
          if-no-files-found: ignore
          retention-days: 3

  # PROJECT DATABASE MIGRATIONS against a real server.
  #
  # Ubuntu only, and that is sufficient: what differs between servers is
  # decided by engine.dialect.name, which the connection URL sets rather
  # than the host. The OS-specific part, how revision 0018 reads the paths a
  # project recorded, does not depend on the backend, and the `pipeline`
  # job runs these tests on SQLite on Windows and macOS.
  #
  # MariaDB rather than MySQL because MySQL 8.4 cannot build a 1.8.1
  # database at all -- it rejects both the VARCHAR(1000) unique keys and
  # the foreign key to condition.id, which names a group rather than a row.
  # MariaDB permits the latter, so it is the only server on which the
  # upgrade-from-release path can be constructed.
  #
  # The charset matrix is not incidental. utf8mb4 is what a new MariaDB 11
  # project gets; utf8mb3 is what existing deployments run, and the only one
  # where 1.8.1's VARCHAR(1000) unique keys fit InnoDB's 3072-byte index
  # limit. MariaDB builds them under utf8mb4 too, enforcing a unique key
  # too long to index through a hidden hash, so the release-upgrade test
  # runs on both; it would skip only on a server that refuses the schema,
  # as MySQL 8.4 does.
  migrations:
    if: inputs.only == 'all' || inputs.only == 'migrations'
    name: migrations mariadb ${{ matrix.charset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        charset: ['utf8mb4', 'utf8mb3']
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: autowisp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          # TestUpgradeFromRelease exports the schema from each release tag;
          # the default shallow clone has no tags and it would skip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AutoWISP and a MySQL driver
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pymysql
      - name: Create the ${{ matrix.charset }} test database
        shell: bash
        run: |
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(
              host="127.0.0.1", port=3306, user="root", password="autowisp"
          )
          with connection.cursor() as cursor:
              cursor.execute(
                  "CREATE DATABASE IF NOT EXISTS autowisp_test "
                  "CHARACTER SET ${{ matrix.charset }}"
              )
          PY
      # SQLite first: it is the backend every project uses, and running it
      # here keeps the two comparable in one log.
      - name: Migration tests on SQLite
        run: >-
          python -m unittest -v autowisp.tests.test_database_migration
          autowisp.tests.test_upgrade_from_release
          autowisp.tests.test_projhome_migration
      - name: Migration tests on MariaDB (${{ matrix.charset }})
        env:
          AUTOWISP_TEST_DB_URL: >-
            mysql+pymysql://root:autowisp@127.0.0.1:3306/autowisp_test
        run: >-
          python -m unittest -v autowisp.tests.test_database_migration
          autowisp.tests.test_upgrade_from_release
          autowisp.tests.test_projhome_migration
