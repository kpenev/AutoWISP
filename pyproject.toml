#Control file for cibuildwheel (generate PIP wheels using github actions)

[build-system]
build-backend = 'mesonpy'
# GitPython is needed at build time: _write_version.py records the git version
# into autowisp/_version.py via get_code_version_str().
requires = ['meson-python', 'GitPython']

[project]
name = 'autowisp'

authors = [
    { name = 'Kaloyan Penev', email = 'Kaloyan.Penev@utdallas.edu' },
    { name = 'Angel Romero', email = 'Angel.Romero@utdallas.edu' },
    { name = 'Ashkan Jafarzadeh', email = 'ashkan.jafarzadeh@utdallas.edu' },
]

maintainers = [
    { name = 'Kaloyan Penev', email = 'Kaloyan.Penev@utdallas.edu' },
    { name = 'Angel Romero', email = 'Angel.Romero@utdallas.edu' },
    { name = 'Ashkan Jafarzadeh', email = 'ashkan.jafarzadeh@utdallas.edu' }
]

license = { file = 'LICENSE' }

classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: MacOS',
    'Operating System :: POSIX :: Linux',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: C++',
    'Programming Language :: C',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering :: Image Processing',
    'Topic :: Scientific/Engineering :: Astronomy',
    'Topic :: Scientific/Engineering :: Physics'
]

dependencies = [
    'antlr4-python3-runtime',
    'asteval',
    'astropy',
    'astroquery',
    'astrowisp >= 2.0.1',
    'configargparse',
    'Django',
    # >= 2.10 for the new dtype API (vlen_dtype/string_dtype/check_enum_dtype,
    # all added in 2.10.0); modern installs are 3.x regardless.
    'h5py >= 2.10',
    'lxml',
    'matplotlib',
    # meepmeep is transitive-only (via pytransit); we never import it. Pin <1
    # because pytransit's numpy-1-compatible releases (<=2.6.18) fail to import
    # against meepmeep>=1. This caps pytransit at 2.7.1, the newest release that
    # works under both numpy 1 and numpy 2. Drop the pin (and let pytransit
    # pull meepmeep>=1 / pytransit 2.8+) only if numpy-1 support is abandoned.
    'meepmeep < 1',
    'numpy >= 1.21',
    'pandas',
    'pillow',
    'platformdirs',
    'psutil',
    'pytransit',
    'rechunker',
    'requests',
    'scipy',
    'sqlalchemy',
    'zarr',
]

description = 'Pipeline for extracting photometry from wide-field night sky images'

readme = 'README.md'

# 3.11 floor: ProcessPoolExecutor(max_tasks_per_child=...) used by run_pool
# needs CPython >= 3.11. No upper ceiling: the old numpy<2 barrier is gone
# (astrowisp 2.0.1, numpy 2, scipy, h5py all ship cp313/cp314 wheels;
# pytransit/meepmeep are pure Python). CI covers 3.11/3.12 today; add 3.13/3.14
# cells once their transitive wheels (notably numba/llvmlite) are confirmed.
requires-python = '>=3.11'

dynamic = ['version']

[project.urls]
source = 'https://github.com/kpenev/AutoWISP'
documentation = 'https://kpenev.github.io/AutoWISP/'

[project.optional-dependencies]
test = []

browser_interface = [
    'Django'
]

[tool.black]
line-length = 80

[project.scripts]
wisp-calibrate = 'autowisp.processing_steps.calibrate:main'
wisp-stack-to-master = 'autowisp.processing_steps.stack_to_master:main'
wisp-stack-to-master-flat = 'autowisp.processing_steps.stack_to_master_flat:main'
wisp-find-stars = 'autowisp.processing_steps.find_stars:main'
wisp-solve-astrometry = 'autowisp.processing_steps.solve_astrometry:main'
wisp-fit-star-shape = 'autowisp.processing_steps.fit_star_shape:main'
wisp-measure-aperture-photometry = 'autowisp.processing_steps.measure_aperture_photometry:main'
wisp-fit-source-extracted-psf-map = 'autowisp.processing_steps.fit_source_extracted_psf_map:main'
wisp-fit-magnitudes = 'autowisp.processing_steps.fit_magnitudes:main'
wisp-create-lightcurves = 'autowisp.processing_steps.create_lightcurves:main'
wisp-epd = 'autowisp.processing_steps.epd:main'
wisp-generate-epd-statistics = 'autowisp.processing_steps.generate_epd_statistics:main'
wisp-tfa = 'autowisp.processing_steps.tfa:main'
wisp-generate-tfa-statistics = 'autowisp.processing_steps.generate_tfa_statistics:main'
wisp-get-from-lc = 'autowisp.diagnostics.get_from_lc:main'
wisp-bui = 'autowisp.browser_interface.start:main'
wisp-survey = 'autowisp.database.user_interface:main'
wisp-cleanup-errors = 'autowisp.error_persistence:cleanup_main'
wisp-crash-report = 'autowisp.crash_report:crash_report_main'
