# Alembic configuration for AutoWISP project databases.
#
# script_location is given relative to %(here)s -- the directory holding this
# file -- so it resolves in a source checkout and in an installed package
# alike, wherever that lands and whatever the current directory happens to be.
#
# sqlalchemy.url is deliberately absent. There is no single project database:
# the engine is chosen at runtime and its connection is handed to env.py
# through Config.attributes by autowisp.database.migrate. env.py refuses to
# run without one, rather than silently falling back to a URL from here.
#
# For development, the stock CLI works against this file, e.g.
#     alembic -c autowisp/database/alembic.ini heads
#     alembic -c autowisp/database/alembic.ini revision --autogenerate \
#         -m "..." --rev-id 0003_short_slug
# Note that autogenerate needs a database to diff against, so it must be run
# through wisp-migrate, which resolves a project home to an engine.

[alembic]
script_location = %(here)s/migrations

# Revision ids are hand-assigned as NNNN_slug (see
# project_db_migrations_plan.md), so the id alone is the filename -- the stock
# template would repeat the slug.
file_template = %%(rev)s
