{% extends 'diagnostics/diagnostics_app.html' %}

{% block header_bar_extra %}
{% if available_diagnostics %}
<div id="diag-vs-diag-selector" class="lcars-bar horizontal">
    <span class="axis-label">X:</span>
    <select id="x-diagnostic-selector"
            class="lcars-bar horizontal button lcars-rust-bg"
            onchange="navigateToDiagPair()">
        {% for diag_name in available_diagnostics %}
        <option value="{{ diag_name }}"
                {% if diag_name == x_diagnostic %}selected{% endif %}>
            {{ diag_name }}
        </option>
        {% endfor %}
    </select>
    <span class="axis-label">Y:</span>
    <select id="y-diagnostic-selector"
            class="lcars-bar horizontal button lcars-rust-bg"
            onchange="navigateToDiagPair()">
        {% for diag_name in available_diagnostics %}
        <option value="{{ diag_name }}"
                {% if diag_name == y_diagnostic %}selected{% endif %}>
            {{ diag_name }}
        </option>
        {% endfor %}
    </select>
</div>
{% endif %}
{% endblock header_bar_extra %}

{% block diagnostics_extra_scripts %}
<script type="text/javascript">
    var diagVsDiagUrlTemplate = (
        "{% url 'diagnostics:display_diag_vs_diag' x_diagnostic='XPLACEHOLDER' y_diagnostic='YPLACEHOLDER' %}"
    );
    function navigateToDiagPair() {
        var x = document.getElementById('x-diagnostic-selector').value;
        var y = document.getElementById('y-diagnostic-selector').value;
        window.location.href = diagVsDiagUrlTemplate
            .replace('XPLACEHOLDER', x)
            .replace('YPLACEHOLDER', y);
    }
</script>
{% endblock diagnostics_extra_scripts %}
