services:
  wisp:
    image: kpenev/wisp:latest
    shm_size: '2g'
    ipc: host
    ports:
      - "8089:8089"
    volumes:
      - type: bind
        source: <IOdir| directory for raw images or calibration results>
        target: /storage/<container name>
      - type: bind
        source: <TMPdir| directory for temporary files>
        target: /tmp
      - type: bind
        source: <BUIDir| directory for BUI logs and other data>
        target: /app_data/autowisp
      - type: bind
        read_only: true
        source: <AnetNarrowDir| directory containing narrow field astroetry.net indices>
        target: /anet_indices/narrow
      - type: bind
        read_only: true
        source: <AnetWideDir| directory containing wide field astroetry.net indices>
        target: /anet_indices/wide
